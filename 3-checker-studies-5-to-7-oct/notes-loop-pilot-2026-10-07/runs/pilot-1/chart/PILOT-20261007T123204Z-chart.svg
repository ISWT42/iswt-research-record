<text x="95" y="84" class="mid">Run pilot-1. Counts only; the floor is measured in this session, from repeats of the fixed arms.</text>
<text x="95" y="104" class="mid">The loops never saw these test blocks or their scores. A rise here is not evidence of anything until the controls pass.</text>
