<style>text{font-family:"Segoe UI",system-ui,Arial,sans-serif;fill:#1d1d1f}.small{font-size:12px}.mid{font-size:13px}.grid{stroke:#d8d8dc;stroke-width:1}.axis{stroke:#444;stroke-width:1.5}</style>
