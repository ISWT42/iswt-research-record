<line x1="95" y1="550" x2="131" y2="550" stroke="#1b6ca8" stroke-width="2.6"/>
<text x="141" y="554" class="small">Own notes (median of the loops; thin bars show the loops' min and max)</text>
<line x1="95" y1="572" x2="131" y2="572" stroke="#b35900" stroke-width="2.6"/>
<text x="141" y="576" class="small">Model-hand (a set written by the coordinating session, a model, not a person)</text>
<line x1="95" y1="594" x2="131" y2="594" stroke="#5a3d99" stroke-width="2.6" stroke-dasharray="7 5"/>
<text x="141" y="598" class="small">Own notes + own method (the control that decides whether a rise may be called recursive)</text>
<text x="95" y="628" class="small">Counts on the points: right answers with that arm, then right answers with Empty on the same block (of 40). The band is the in-session noise floor, plus and minus f.</text>
<text x="95" y="646" class="small">Floor f = 2 per 40-item block: the 90th percentile of 36 absolute differences between repeats of the same arm, at least 2 (design 4.8).</text>
<text x="95" y="664" class="small">Labels read: gain (right with the arm v right with Empty). Own notes: the median of the loops; two loops here, so a half count can appear.</text>
</svg>
